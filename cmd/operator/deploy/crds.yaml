# CustomResourceDefinitions for the AeroLLM operator (aerollm.io/v1alpha1).
# Field names and constraints mirror api/v1alpha1; the operator performs the
# full validation (DAG checks, unknown spec fields, ...) and reports it in
# status.conditions.
#
#   kubectl apply -f cmd/operator/deploy/crds.yaml
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: aeroroutes.aerollm.io
spec:
  group: aerollm.io
  scope: Namespaced
  names:
    kind: AeroRoute
    listKind: AeroRouteList
    plural: aeroroutes
    singular: aeroroute
    shortNames: [ar]
    categories: [aerollm]
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Strategy
          type: string
          jsonPath: .spec.strategy
        - name: Ready
          type: string
          jsonPath: .status.conditions[?(@.type=="Ready")].status
        - name: Reason
          type: string
          jsonPath: .status.conditions[?(@.type=="Ready")].reason
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          properties:
            apiVersion: {type: string}
            kind: {type: string}
            metadata: {type: object}
            spec:
              type: object
              properties:
                strategy:
                  type: string
                  enum: ["", round_robin, least_busy, usage_based, latency, cost, fallback, weighted]
                models:
                  type: array
                  items: {type: string, minLength: 1, maxLength: 128}
                providers:
                  type: array
                  items: {type: string, minLength: 1, maxLength: 128}
                fallback:
                  type: array
                  items: {type: string, minLength: 1, maxLength: 128}
                breaker_config:
                  description: max_failures, reset_timeout (seconds or "30s"), half_open_max_calls.
                  type: object
                  x-kubernetes-preserve-unknown-fields: true
                weights:
                  type: object
                  additionalProperties: {type: number, minimum: 0}
            status:
              type: object
              properties:
                healthy: {type: boolean}
                latency_ms: {type: number}
                circuit_open: {type: boolean}
                providers:
                  type: object
                  additionalProperties: {type: string}
                observedGeneration: {type: integer, format: int64}
                conditions:
                  type: array
                  x-kubernetes-list-type: map
                  x-kubernetes-list-map-keys: [type]
                  items:
                    type: object
                    required: [type, status]
                    properties:
                      type: {type: string, maxLength: 316}
                      status: {type: string, enum: ["True", "False", "Unknown"]}
                      observedGeneration: {type: integer, format: int64, minimum: 0}
                      lastTransitionTime: {type: string, format: date-time}
                      reason: {type: string, maxLength: 1024}
                      message: {type: string, maxLength: 32768}
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: aerobudgets.aerollm.io
spec:
  group: aerollm.io
  scope: Namespaced
  names:
    kind: AeroBudget
    listKind: AeroBudgetList
    plural: aerobudgets
    singular: aerobudget
    shortNames: [ab]
    categories: [aerollm]
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: MaxUSD
          type: number
          jsonPath: .spec.max_usd
        - name: MonthlyCap
          type: number
          jsonPath: .spec.monthly_cap
        - name: Ready
          type: string
          jsonPath: .status.conditions[?(@.type=="Ready")].status
        - name: Reason
          type: string
          jsonPath: .status.conditions[?(@.type=="Ready")].reason
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          properties:
            apiVersion: {type: string}
            kind: {type: string}
            metadata: {type: object}
            spec:
              type: object
              properties:
                api_key:
                  description: Inline key (discouraged; readable by anyone who can get the resource). Prefer api_key_secret_ref.
                  type: string
                  maxLength: 256
                api_key_secret_ref:
                  description: '"<secret-name>/<key>" of a Secret in the same namespace.'
                  type: string
                  pattern: '^[a-z0-9]([-a-z0-9.]*[a-z0-9])?/[-._a-zA-Z0-9]+$'
                max_usd: {type: number, minimum: 0}
                monthly_cap: {type: number, minimum: 0}
                alert_webhook:
                  type: string
                  pattern: '^https://'
            status:
              type: object
              properties:
                spent_usd: {type: number}
                remaining_usd: {type: number}
                alert_sent: {type: boolean}
                observedGeneration: {type: integer, format: int64}
                conditions:
                  type: array
                  x-kubernetes-list-type: map
                  x-kubernetes-list-map-keys: [type]
                  items:
                    type: object
                    required: [type, status]
                    properties:
                      type: {type: string, maxLength: 316}
                      status: {type: string, enum: ["True", "False", "Unknown"]}
                      observedGeneration: {type: integer, format: int64, minimum: 0}
                      lastTransitionTime: {type: string, format: date-time}
                      reason: {type: string, maxLength: 1024}
                      message: {type: string, maxLength: 32768}
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: aeroagentpipelines.aerollm.io
spec:
  group: aerollm.io
  scope: Namespaced
  names:
    kind: AeroAgentPipeline
    listKind: AeroAgentPipelineList
    plural: aeroagentpipelines
    singular: aeroagentpipeline
    shortNames: [aap]
    categories: [aerollm]
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Version
          type: string
          jsonPath: .spec.version
        - name: Valid
          type: string
          jsonPath: .status.conditions[?(@.type=="Valid")].status
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          properties:
            apiVersion: {type: string}
            kind: {type: string}
            metadata: {type: object}
            spec:
              type: object
              required: [nodes]
              properties:
                name: {type: string, maxLength: 253}
                version: {type: string, maxLength: 128}
                nodes:
                  type: array
                  minItems: 1
                  items: {type: string, minLength: 1, maxLength: 128}
                edges:
                  description: Directed "from->to" pairs; the graph must be acyclic.
                  type: array
                  items: {type: string, pattern: '^.+->.+$'}
                tools:
                  type: array
                  items: {type: string, minLength: 1, maxLength: 128}
                parameters:
                  type: object
                  x-kubernetes-preserve-unknown-fields: true
            status:
              type: object
              properties:
                last_run: {type: string}
                state: {type: string}
                error_count: {type: integer}
                failed_nodes:
                  type: array
                  items: {type: string}
                observedGeneration: {type: integer, format: int64}
                conditions:
                  type: array
                  x-kubernetes-list-type: map
                  x-kubernetes-list-map-keys: [type]
                  items:
                    type: object
                    required: [type, status]
                    properties:
                      type: {type: string, maxLength: 316}
                      status: {type: string, enum: ["True", "False", "Unknown"]}
                      observedGeneration: {type: integer, format: int64, minimum: 0}
                      lastTransitionTime: {type: string, format: date-time}
                      reason: {type: string, maxLength: 1024}
                      message: {type: string, maxLength: 32768}
