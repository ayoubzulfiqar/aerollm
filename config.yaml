app:
  name: "AeroLLM"
  version: "dev"
  env: "development"

server:
  port: 8080
  read_timeout: 30s
  write_timeout: 120s
  idle_timeout: 120s
  shutdown_timeout: 20s
  max_body_bytes: 10485760

redis:
  addr: "localhost:6379"
  password: ""
  db: 0
  pool_size: 25
  min_idle_conns: 5
  # Fail startup when Redis is unreachable (otherwise run in degraded mode).
  required: false

auth:
  # Admin key for key management and the control plane. Leave empty to have a
  # random key generated (and printed once) at startup.
  master_key: "${AEROLLM_MASTER_KEY:-}"
  # Static client keys allowed to call the inference APIs.
  api_keys: []

security:
  cors_allowed_origins: []
  public_metrics: true
  enable_pprof: false

providers:
  - name: "openai"
    type: "openai-compatible"
    api_key: "${OPENAI_API_KEY}"
    base_url: "https://api.openai.com/v1"
    models: ["gpt-4o", "gpt-4o-mini"]

  - name: "groq"
    type: "openai-compatible"
    api_key: "${GROQ_API_KEY}"
    base_url: "https://api.groq.com/openai/v1"
    models: ["llama-3-70b", "mixtral-8x7b"]

  - name: "anthropic"
    type: "anthropic"
    api_key: "${ANTHROPIC_API_KEY}"
    models: ["claude-3-5-sonnet-20241022", "claude-3-haiku-20240307"]

  - name: "bedrock"
    type: "bedrock"
    models: ["anthropic.claude-3-5-sonnet-20241022-v2:0", "meta.llama3-70b-instruct-v1:0"]

  - name: "gemini"
    type: "gemini"
    api_key: "${GEMINI_API_KEY}"
    models: ["gemini-1.5-pro", "gemini-1.5-flash"]

router:
  strategy: "round_robin"
  max_attempts: 3
  # Wait out an upstream Retry-After (up to this long) when no other provider
  # is left to fall back to. 0 disables.
  max_retry_wait: 0s
  circuit_break:
    max_failures: 5
    reset_timeout: 60s
    half_open_max_calls: 3

rate_limit:
  default_rps: 10.0
  burst_multiplier: 2
  strategy: "token_bucket"

cache:
  enabled: true
  ttl: 15m
  exact_prefix: "cache:exact:"
  semantic_prefix: "cache:semantic:"
  semantic_threshold: 0.95
  semantic_enabled: false
  # Keep false so one API key can never be served another key's response.
  shared_across_keys: false
  # Embed prompts for the semantic cache with this model (via the gateway's
  # embeddings route); empty uses a local lexical embedder.
  semantic_embedding_model: ""

telemetry:
  enabled: false
  exporter: "prometheus"
  service_name: "aerollm"
  sample_rate: 1.0

agent:
  enabled: true
  max_iterations: 10
  tool_timeout: 30s
  max_concurrent: 10
  cache_tool_results: true

logging:
  level: "info"
  format: "json"

guardrails:
  enabled: true

finops:
  enabled: true
  # Budget applied to every non-admin key without an explicit budget (0 = none).
  default_max_usd: 0
  # lifetime | daily | monthly (UTC)
  budget_period: lifetime

# Durable state (virtual keys, budgets, secrets, batches, control-plane
# stores) in a single-process bbolt file. Use one file per gateway instance.
persistence:
  enabled: true
  path: ""   # default: $AEROLLM_STATE_DIR/gateway.db

webhooks:
  enabled: true

callbacks:
  # Webhook callback: sends OnSuccess/OnError events to a configurable endpoint.
  webhook:
    enabled: false
    url: ""
    secret: ""
    timeout: 5s
    retries: 3
    retry_delay: 200ms
  # Langfuse callback: sends traces and generations to Langfuse.
  langfuse:
    enabled: false
    public_key: "${LANGFUSE_PUBLIC_KEY}"
    secret_key: "${LANGFUSE_SECRET_KEY}"
    base_url: "https://cloud.langfuse.com"
    project_id: "default"
  # Datadog callback: sends metrics and log events to Datadog.
  datadog:
    enabled: false
    api_key: "${DATADOG_API_KEY}"
    base_url: "https://api.datadoghq.com"
    site: "datadoghq.com"
