app:
  name: "AeroLLM"
  version: "dev"
  env: "development"

server:
  port: 8080
  read_timeout: 30s
  write_timeout: 120s
  idle_timeout: 120s

redis:
  addr: "localhost:6379"
  password: ""
  db: 0
  pool_size: 25
  min_idle_conns: 5

providers:
  - name: "openai"
    type: "openai-compatible"
    api_key: "${OPENAI_API_KEY}"
    base_url: "https://api.openai.com/v1"
    models: ["gpt-4o", "gpt-4o-mini"]

  - name: "groq"
    type: "openai-compatible"
    api_key: "${GROQ_API_KEY}"
    base_url: "https://api.groq.com/openai/v1"
    models: ["llama-3-70b", "mixtral-8x7b"]

  - name: "anthropic"
    type: "anthropic"
    api_key: "${ANTHROPIC_API_KEY}"
    models: ["claude-3-5-sonnet-20241022", "claude-3-haiku-20240307"]

  - name: "bedrock"
    type: "bedrock"
    models: ["anthropic.claude-3-5-sonnet-20241022-v2:0", "meta.llama3-70b-instruct-v1:0"]

  - name: "gemini"
    type: "gemini"
    api_key: "${GEMINI_API_KEY}"
    models: ["gemini-1.5-pro", "gemini-1.5-flash"]

router:
  strategy: "round_robin"
  circuit_break:
    max_failures: 5
    reset_timeout: 60s
    half_open_max_calls: 3

rate_limit:
  default_rps: 10.0
  burst_multiplier: 2
  strategy: "token_bucket"

cache:
  enabled: true
  ttl: 15m
  exact_prefix: "cache:exact:"
  semantic_prefix: "cache:semantic:"
  semantic_threshold: 0.85

telemetry:
  enabled: false
  exporter: "prometheus"
  service_name: "aerollm"
  sample_rate: 1.0

agent:
  enabled: true
  max_iterations: 10
  tool_timeout: 30s
  max_concurrent: 10
  cache_tool_results: true

logging:
  level: "info"
  format: "json"

guardrails:
  enabled: true

finops:
  enabled: true
  default_max_usd: 0

webhooks:
  enabled: true

callbacks:
  # Webhook callback: sends OnSuccess/OnError events to a configurable endpoint.
  webhook:
    enabled: false
    url: ""
    secret: ""
    timeout: 5s
    retries: 3
    retry_delay: 200ms
  # Langfuse callback: sends traces and generations to Langfuse.
  langfuse:
    enabled: false
    api_key: "${LANGFUSE_API_KEY}"
    base_url: "https://cloud.langfuse.com"
    project_id: "default"
  # Datadog callback: sends metrics and log events to Datadog.
  datadog:
    enabled: false
    api_key: "${DATADOG_API_KEY}"
    base_url: "https://api.datadoghq.com"
    site: "datadoghq.com"
