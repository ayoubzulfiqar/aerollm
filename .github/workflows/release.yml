name: Backend Build & Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux
            goos: linux
            goarch: amd64
            ext: ''
          - os: windows-latest
            target: windows
            goos: windows
            goarch: amd64
            ext: .exe
          - os: macos-latest
            target: macos
            goos: darwin
            goarch: arm64
            ext: ''

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install zip
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y zip

      - name: Vet
        run: go vet ./...

      - name: Run Tests
        if: matrix.os != 'ubuntu-latest'
        run: go test ./...

      - name: Run Tests (race detector)
        if: matrix.os == 'ubuntu-latest'
        run: go test -race ./...

      - name: Build Backend Binary
        run: |
          mkdir -p bin
          go build -trimpath -ldflags="-s -w -X github.com/ayoubzulfiqar/aerollm/internal/config.buildVersion=${{ github.ref_name }}" -o bin/aerollm-${{ matrix.target }}${{ matrix.ext }} ./cmd/server
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0

      - name: Ensure executable bit
        if: matrix.os != 'windows-latest'
        run: chmod +x bin/aerollm-${{ matrix.target }}

      - name: Package binary
        shell: bash
        run: |
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            powershell -Command "Compress-Archive -Path 'bin/aerollm-${{ matrix.target }}${{ matrix.ext }}' -DestinationPath 'bin/aerollm-${{ matrix.target }}.zip' -Force"
          else
            (cd bin && zip aerollm-${{ matrix.target }}.zip aerollm-${{ matrix.target }})
          fi

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            bin/aerollm-${{ matrix.target }}.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
