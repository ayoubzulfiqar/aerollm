services:
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    # Not published on the host: only the gateway needs to reach Redis.
    expose:
      - "6379"
    volumes:
      - redis_data:/data
    networks:
      - aerollm-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  aerollm:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    depends_on:
      redis:
        condition: service_healthy
    environment:
      - AEROLLM_APP_ENV=development
      - AEROLLM_REDIS_ADDR=redis:6379
      # Set a strong admin key (otherwise a random one is generated and logged
      # once at startup).
      - AEROLLM_AUTH_MASTER_KEY=${AEROLLM_AUTH_MASTER_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    volumes:
      - aerollm_data:/data
    networks:
      - aerollm-net
    restart: unless-stopped

volumes:
  redis_data:
  aerollm_data:

networks:
  aerollm-net:
    driver: bridge
