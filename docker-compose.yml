version: "3.9"

services:
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - aerollm-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  aerollm:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    depends_on:
      redis:
        condition: service_healthy
    environment:
      - APP_ENV=development
      - AEROLLM_REDIS_ADDR=redis:6379
      - APP_PORT=8080
    networks:
      - aerollm-net
    restart: unless-stopped

volumes:
  redis_data:

networks:
  aerollm-net:
    driver: bridge
